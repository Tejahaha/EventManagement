{% extends 'base.html' %}
{% block title %}Delete Event{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white"><h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Delete Event</h5></div>
            <div class="card-body">
                <p>Are you sure you want to delete <strong>"{{ event.title }}"</strong>? This action cannot be undone.</p>
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2"><i class="bi bi-trash"></i> Yes, Delete</button>
                    <a href="{% url 'events:detail' event.pk %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
